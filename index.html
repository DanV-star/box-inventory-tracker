<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Box Inventory">
<title>Box Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --border: #d8dbe0;
    --accent: #1d4ed8;
    --accent-text: #ffffff;
    --danger: #b91c1c;
    --warning-bg: #fff7ed;
    --warning-border: #f59e0b;
    --warning-text: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1e2126;
      --text: #f1f2f4;
      --text-muted: #9aa0a8;
      --border: #34383f;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --danger: #f87171;
      --warning-bg: #2a2110;
      --warning-border: #d97706;
      --warning-text: #fbbf24;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior-y: contain;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top, 0)) 16px 12px;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  h1 {
    font-size: 1.1rem;
    margin: 0;
  }

  #count {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }

  main {
    padding: 16px;
    padding-bottom: 40px;
    max-width: 480px;
    margin: 0 auto;
  }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }

  section h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0 0 10px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .field {
    margin-bottom: 10px;
  }

  .field:last-child {
    margin-bottom: 0;
  }

  input[type="text"],
  input[type="date"],
  textarea {
    width: 100%;
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }

  input[type="date"] {
    width: auto;
    max-width: 160px;
    font-size: 0.9rem;
    padding: 6px 8px;
  }

  textarea {
    resize: vertical;
    min-height: 60px;
  }

  details summary {
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 2px 0;
  }

  details[open] summary {
    margin-bottom: 12px;
  }

  #entry-number {
    width: 100%;
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.05em;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  #entry-error {
    color: var(--danger);
    font-size: 0.85rem;
    min-height: 1.2em;
    margin-top: 6px;
  }

  .voice-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }

  #voice-language-select {
    flex: 1;
    font-size: 0.9rem;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }

  #mic-btn {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-alt, var(--bg));
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  #mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    animation: mic-pulse 1.1s ease-in-out infinite;
  }

  #mic-btn:disabled {
    opacity: 0.4;
  }

  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(185, 28, 28, 0); }
  }

  #voice-status {
    color: var(--text-muted);
    font-size: 0.82rem;
    min-height: 1.2em;
    margin-bottom: 8px;
    text-align: center;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  #add-btn {
    width: 100%;
    margin-top: 10px;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
  }

  #add-btn:active {
    opacity: 0.85;
  }

  .confirm-panel {
    text-align: center;
  }

  .confirm-number {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin: 4px 0 10px;
    font-variant-numeric: tabular-nums;
  }

  .confirm-warning {
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    color: var(--warning-text);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  .confirm-actions {
    display: flex;
    gap: 10px;
  }

  .confirm-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    border: none;
  }

  #confirm-yes {
    background: var(--accent);
    color: var(--accent-text);
  }

  #confirm-no {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .actions-row {
    display: flex;
    gap: 10px;
  }

  .actions-row button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  #export-btn {
    border-color: var(--accent);
    color: var(--accent);
  }

  #reset-btn {
    border-color: var(--danger);
    color: var(--danger);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 8px 16px 24px;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>Box Inventory</h1>
    <span id="count">0 recorded</span>
  </div>
</header>
<main>
  <section>
    <details id="job-info-details" open>
      <summary>Job info</summary>
      <div class="field">
        <label for="client-name">Client name</label>
        <input id="client-name" type="text" autocomplete="off" placeholder="e.g. Jane Smith">
      </div>
      <div class="field">
        <label for="job-date">Date</label>
        <input id="job-date" type="date">
      </div>
      <div class="field">
        <label for="job-notes">Notes</label>
        <textarea id="job-notes" placeholder="Anything worth noting about this job..."></textarea>
      </div>
    </details>
  </section>

  <section id="entry-section">
    <h2>Add a box number</h2>
    <div class="voice-row">
      <select id="voice-language-select">
        <option value="en-US">English</option>
        <option value="es-US">Spanish</option>
        <option value="pt-BR">Portuguese</option>
        <option value="ht-HT">Haitian Creole</option>
        <option value="zh-CN">Mandarin</option>
        <option value="vi-VN">Vietnamese</option>
        <option value="ar-SA">Arabic</option>
        <option value="hi-IN">Hindi</option>
      </select>
      <button id="mic-btn" type="button" aria-label="Speak a number">🎤</button>
    </div>
    <div id="voice-status"></div>
    <form id="entry-form">
      <input id="entry-number" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="000" autocomplete="off">
      <div id="entry-error"></div>
      <button id="add-btn" type="submit">Add</button>
    </form>
  </section>

  <section id="confirm-section" class="confirm-panel hidden">
    <h2>Confirm</h2>
    <div id="confirm-warning" class="confirm-warning hidden"></div>
    <div>Add box number</div>
    <div class="confirm-number" id="confirm-number">000</div>
    <div class="confirm-actions">
      <button id="confirm-no" type="button">Cancel</button>
      <button id="confirm-yes" type="button">Confirm</button>
    </div>
  </section>

  <section>
    <div class="actions-row">
      <button id="export-btn" type="button">Export CSV</button>
      <button id="reset-btn" type="button">New Job</button>
    </div>
  </section>
</main>
<footer>Enter each sticker number as you use it. Numbers are saved on this phone until you start a new job.</footer>
<div id="toast" class="toast"></div>
<script>
  const MIN_NUMBER = 0;
  const MAX_NUMBER = 500;
  const COLUMNS_PER_ROW = 20;
  const USED_STORAGE_KEY = "boxInventory.usedNumbers";
  const JOB_INFO_STORAGE_KEY = "boxInventory.jobInfo";

  function formatNumber(n) {
    return String(n).padStart(3, "0");
  }

  function loadUsedSet() {
    try {
      const raw = localStorage.getItem(USED_STORAGE_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch (e) {
      return new Set();
    }
  }

  function saveUsedSet(usedSet) {
    localStorage.setItem(USED_STORAGE_KEY, JSON.stringify(Array.from(usedSet)));
  }

  function loadJobInfo() {
    try {
      const raw = localStorage.getItem(JOB_INFO_STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveJobInfo(jobInfo) {
    localStorage.setItem(JOB_INFO_STORAGE_KEY, JSON.stringify(jobInfo));
  }

  let usedNumbers = loadUsedSet();
  let jobInfo = loadJobInfo();
  let pendingNumber = null;

  const countLabel = document.getElementById("count");
  const clientNameInput = document.getElementById("client-name");
  const jobDateInput = document.getElementById("job-date");
  const jobNotesInput = document.getElementById("job-notes");
  const entryForm = document.getElementById("entry-form");
  const entryNumberInput = document.getElementById("entry-number");
  const entryError = document.getElementById("entry-error");
  const entrySection = document.getElementById("entry-section");
  const confirmSection = document.getElementById("confirm-section");
  const confirmNumberLabel = document.getElementById("confirm-number");
  const confirmWarning = document.getElementById("confirm-warning");
  const confirmYesButton = document.getElementById("confirm-yes");
  const confirmNoButton = document.getElementById("confirm-no");
  const exportButton = document.getElementById("export-btn");
  const resetButton = document.getElementById("reset-btn");
  const toast = document.getElementById("toast");
  const micButton = document.getElementById("mic-btn");
  const voiceLanguageSelect = document.getElementById("voice-language-select");
  const voiceStatus = document.getElementById("voice-status");

  function updateCount() {
    countLabel.textContent = usedNumbers.size + " recorded";
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    window.clearTimeout(showToast._timer);
    showToast._timer = window.setTimeout(() => toast.classList.remove("show"), 1400);
  }

  function initJobInfoFields() {
    clientNameInput.value = jobInfo.clientName || "";
    jobDateInput.value = jobInfo.date || new Date().toISOString().slice(0, 10);
    jobNotesInput.value = jobInfo.notes || "";
    persistJobInfo();
  }

  function persistJobInfo() {
    jobInfo = {
      clientName: clientNameInput.value,
      date: jobDateInput.value,
      notes: jobNotesInput.value,
    };
    saveJobInfo(jobInfo);
  }

  [clientNameInput, jobDateInput, jobNotesInput].forEach((el) => {
    el.addEventListener("change", persistJobInfo);
    el.addEventListener("input", persistJobInfo);
  });

  function parseEntry(rawValue) {
    const trimmed = rawValue.trim();
    if (trimmed === "" || !/^\d+$/.test(trimmed)) {
      return { valid: false, message: "Enter a number." };
    }
    const parsed = parseInt(trimmed, 10);
    if (parsed < MIN_NUMBER || parsed > MAX_NUMBER) {
      return { valid: false, message: "Must be between 000 and 500." };
    }
    return { valid: true, label: formatNumber(parsed) };
  }

  function openConfirm(label) {
    pendingNumber = label;
    confirmNumberLabel.textContent = label;
    if (usedNumbers.has(label)) {
      confirmWarning.textContent = label + " was already recorded. Add it again?";
      confirmWarning.classList.remove("hidden");
    } else {
      confirmWarning.classList.add("hidden");
    }
    entrySection.classList.add("hidden");
    confirmSection.classList.remove("hidden");
  }

  function closeConfirm() {
    pendingNumber = null;
    confirmSection.classList.add("hidden");
    entrySection.classList.remove("hidden");
    entryNumberInput.value = "";
    entryNumberInput.focus();
  }

  entryForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const result = parseEntry(entryNumberInput.value);
    if (!result.valid) {
      entryError.textContent = result.message;
      return;
    }
    entryError.textContent = "";
    openConfirm(result.label);
  });

  // --- Voice input ---
  const VOICE_LANGUAGE_STORAGE_KEY = "boxInventory.voiceLanguage";
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  voiceLanguageSelect.value = localStorage.getItem(VOICE_LANGUAGE_STORAGE_KEY) || "en-US";

  voiceLanguageSelect.addEventListener("change", () => {
    localStorage.setItem(VOICE_LANGUAGE_STORAGE_KEY, voiceLanguageSelect.value);
  });

  function extractDigits(transcript) {
    return transcript.replace(/\D/g, "");
  }

  function stopListening() {
    isListening = false;
    micButton.classList.remove("listening");
  }

  function handleVoiceResult(event) {
    const transcript = Array.from(event.results)
      .map((result) => result[0].transcript)
      .join(" ")
      .trim();
    const isFinal = event.results[event.results.length - 1].isFinal;

    voiceStatus.textContent = 'Heard: "' + transcript + '"';

    if (!isFinal) {
      return;
    }

    const digits = extractDigits(transcript);
    if (digits === "") {
      showToast("Didn't catch a number — try again");
      return;
    }

    entryNumberInput.value = digits;
    entryForm.requestSubmit();
  }

  function startListening() {
    recognition = new SpeechRecognitionImpl();
    recognition.lang = voiceLanguageSelect.value;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.addEventListener("result", handleVoiceResult);
    recognition.addEventListener("end", stopListening);
    recognition.addEventListener("error", (event) => {
      stopListening();
      voiceStatus.textContent = "";
      showToast("Voice error: " + event.error);
    });

    isListening = true;
    micButton.classList.add("listening");
    voiceStatus.textContent = "Listening...";
    recognition.start();
  }

  if (!SpeechRecognitionImpl) {
    micButton.disabled = true;
    micButton.title = "Voice input isn't supported on this browser";
    voiceStatus.textContent = "Voice input isn't supported on this browser.";
  } else {
    micButton.addEventListener("click", () => {
      if (isListening) {
        recognition.stop();
        return;
      }
      startListening();
    });
  }

  confirmYesButton.addEventListener("click", () => {
    if (pendingNumber === null) {
      return;
    }
    usedNumbers.add(pendingNumber);
    saveUsedSet(usedNumbers);
    updateCount();
    showToast(pendingNumber + " added");
    closeConfirm();
  });

  confirmNoButton.addEventListener("click", () => {
    closeConfirm();
  });

  function csvEscape(value) {
    const str = String(value);
    if (/[",\r\n]/.test(str)) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  function buildCsvRows() {
    const rows = [];
    rows.push(["Client Name", jobInfo.clientName || ""]);
    rows.push(["Date", jobInfo.date || ""]);
    rows.push([]);

    const totalNumbers = MAX_NUMBER - MIN_NUMBER + 1;
    const totalRows = Math.ceil(totalNumbers / COLUMNS_PER_ROW);

    for (let row = 0; row < totalRows; row++) {
      const rowCells = [];
      for (let col = 0; col < COLUMNS_PER_ROW; col++) {
        const n = MIN_NUMBER + row * COLUMNS_PER_ROW + col;
        if (n > MAX_NUMBER) {
          rowCells.push("");
          continue;
        }
        const label = formatNumber(n);
        rowCells.push(usedNumbers.has(label) ? "(" + label + ")" : label);
      }
      rows.push(rowCells);
    }

    rows.push([]);
    rows.push(["Notes", jobInfo.notes || ""]);

    return rows;
  }

  function downloadCsv() {
    const rows = buildCsvRows();
    const csv = rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const datePart = (jobInfo.date || "job").replace(/[^0-9-]/g, "") || "job";
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = "box-inventory-" + datePart + ".csv";
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
    URL.revokeObjectURL(url);
  }

  exportButton.addEventListener("click", downloadCsv);

  function resetJob() {
    const confirmed = confirm("Start a new job? This clears all recorded numbers and job info on this phone.");
    if (!confirmed) {
      return;
    }
    usedNumbers = new Set();
    saveUsedSet(usedNumbers);
    clientNameInput.value = "";
    jobDateInput.value = new Date().toISOString().slice(0, 10);
    jobNotesInput.value = "";
    persistJobInfo();
    updateCount();
    closeConfirm();
    document.getElementById("job-info-details").open = true;
  }

  resetButton.addEventListener("click", resetJob);

  initJobInfoFields();
  updateCount();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
